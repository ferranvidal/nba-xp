name: Deploy

# Becomes `on: push: branches: [main]` once the app exists.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT: saas-458416
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/saas-458416/nbaxp/nbaxp:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy API service
        run: gcloud run deploy nbaxp-api --image "$IMAGE" --project "$PROJECT" --region "$REGION" --quiet

      - name: Update replay job
        run: gcloud run jobs update nbaxp-replay --image "$IMAGE" --project "$PROJECT" --region "$REGION" --quiet
